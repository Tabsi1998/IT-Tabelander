name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt

      - name: Validate dependencies and Python sources
        run: |
          python -m pip check
          python -m compileall -q backend
          cd backend
          python -c "import server; print(server.app.title)"
          python -m pytest tests/test_unit_runtime.py tests/test_inquiry_dolibarr.py -q -p no:cacheprovider

  integration:
    # The local check runs the same suites first; this job is the control on
    # GitHub (issue #34). Settings are throwaway values made during the run.
    name: Integration (MongoDB, HTTPS)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0.39-jammy
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MONGO_URL: mongodb://127.0.0.1:27018
      DB_NAME: it_tabelander_ci_test
      MONGO_SERVER_SELECTION_TIMEOUT_MS: '3000'
      MONGO_CONNECT_TIMEOUT_MS: '3000'
      MONGO_OPERATION_TIMEOUT_MS: '5000'
      ADMIN_EMAIL: ci-admin@example.com
      CANONICAL_BASE_URL: https://127.0.0.1:18011
      CORS_ORIGINS: https://127.0.0.1:18011

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt

      - name: Throwaway secrets and certificate
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
          echo "ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 2 \
            -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" -subj /CN=localhost \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

      - name: Start the API over HTTPS
        working-directory: backend
        run: |
          nohup python -m uvicorn server:app --host 127.0.0.1 --port 18011 \
            --ssl-keyfile "$RUNNER_TEMP/key.pem" --ssl-certfile "$RUNNER_TEMP/cert.pem" \
            > "$RUNNER_TEMP/server.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS --cacert "$RUNNER_TEMP/cert.pem" https://127.0.0.1:18011/api/health; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/server.log"
          exit 1

      - name: API and regression suites
        working-directory: backend
        env:
          IT_TABELANDER_RUN_INTEGRATION: '1'
          REACT_APP_BACKEND_URL: https://127.0.0.1:18011
        run: |
          export REQUESTS_CA_BUNDLE="$RUNNER_TEMP/cert.pem"
          python -m pytest tests/test_api.py tests/test_regression_iter2.py -q -rfEs -p no:cacheprovider

      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pinned Yarn
        run: npm install --global yarn@1.22.22

      - name: Install from lockfile
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive --production=false

      - name: Build production frontend
        working-directory: frontend
        run: yarn build

  deployment-scripts:
    name: Deployment scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Bash syntax and whitespace
        run: |
          bash -n start.sh stop.sh update.sh
          git diff --check
