name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint PHP
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: php tests/run.php

      - name: Check JavaScript syntax
        run: find public/assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate JSON
        run: php -r 'foreach (glob("private/data/*.json") as $file) { json_decode(file_get_contents($file), true, 512, JSON_THROW_ON_ERROR); }'

      - name: Validate generated sitemap XML
        run: |
          php sitemap.php > /tmp/it-tabelander-sitemap.xml
          php -r '$xml = simplexml_load_file("/tmp/it-tabelander-sitemap.xml"); if ($xml === false) { exit(1); }'

      - name: Reject tracked runtime data
        run: test -z "$(git ls-files 'private/logs/**' 'private/cache/**')"

      - name: Enforce image budget
        run: test -z "$(find public/assets/img -type f -size +500k -print)"
