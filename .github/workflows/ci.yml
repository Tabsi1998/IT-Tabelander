name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.14']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements-dev.txt

      - name: Validate dependencies and Python sources
        run: |
          python -m pip check
          python -m compileall -q backend
          cd backend
          python -c "import server; print(server.app.title)"
          python -m pytest tests/test_unit_runtime.py tests/test_inquiry_dolibarr.py -q -p no:cacheprovider

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install pinned Yarn
        run: npm install --global yarn@1.22.22

      - name: Install from lockfile
        working-directory: frontend
        run: yarn install --frozen-lockfile --non-interactive --production=false

      - name: Build production frontend
        working-directory: frontend
        run: yarn build

  deployment-scripts:
    name: Deployment scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Bash syntax and whitespace
        run: |
          bash -n start.sh stop.sh update.sh
          git diff --check
